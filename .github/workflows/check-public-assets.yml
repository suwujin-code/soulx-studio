name: Verify public build inputs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-public-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependency availability and licensed reference assets
        shell: python
        run: |
          import hashlib,json,pathlib,urllib.request,urllib.error
          out=pathlib.Path('verified-inputs');out.mkdir()
          def get(url):
              request=urllib.request.Request(url,headers={'User-Agent':'SoulX-public-release-verification'})
              with urllib.request.urlopen(request,timeout=60) as response:return response.read()
          def get_json(url):return json.loads(get(url))
          report={'dependencies':[],'reference':None,'gsap':None}
          for package,version in [('fastapi','0.128.2'),('uvicorn','0.48.0'),('pydantic','2.13.4'),('python-multipart','0.0.29'),('httpx','0.28.1'),('soundfile','0.13.1'),('numpy','1.26.4'),('imageio-ffmpeg','0.6.0'),('pytest','9.0.2')]:
              info=get_json('https://pypi.org/pypi/'+package+'/json')
              report['dependencies'].append({'package':package,'requested':version,'available':bool(info['releases'].get(version)),'latest':info['info']['version']})
          repo='eduhk-compling/11601706_QIUZHILIANG'
          metadata=get_json('https://huggingface.co/api/datasets/'+repo)
          commit=metadata['sha']
          tree=get_json('https://huggingface.co/api/datasets/'+repo+'/tree/'+commit+'?recursive=true&limit=1000')
          target='c92ad48a81830a3c10029007439314408bb4a21c992e9b5bc1ce5e11b62ee6c5'
          for item in tree:
              path=item.get('path','')
              if path.split('/')[-1].lower()=='s006.wav':
                  url='https://huggingface.co/datasets/'+repo+'/resolve/'+commit+'/'+urllib.parse.quote(path,safe='/')
                  data=get(url)
                  if hashlib.sha256(data).hexdigest()==target:
                      (out/'cantonese_hk_male_s006.wav').write_bytes(data)
                      report['reference']={'repository':repo,'commit':commit,'path':path,'url':url,'bytes':len(data),'sha256':target}
                      break
          data=get('https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js')
          digest=hashlib.sha256(data).hexdigest()
          if digest!='c174bfce53a729418d57a8ad8625e7247c793a22fef8e2851e3cfa3de9cd8280':raise RuntimeError('GSAP file differs from the reviewed composition')
          (out/'gsap.min.js').write_bytes(data)
          report['gsap']={'version':'3.14.2','sha256':digest}
          (out/'verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['reference'] is None:raise RuntimeError('The exact licensed reference file was not located; do not substitute another voice')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-public-inputs
          path: verified-inputs/
          retention-days: 3
