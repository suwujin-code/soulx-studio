name: Desktop source checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workbench/**'
      - 'desktop-installer/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbench test dependencies
        run: python -m pip install -r requirements.desktop.txt pytest==9.0.2
      - name: Python source tests (not speech acceptance)
        run: python -m pytest tests -q --junitxml=target-python-tests.xml
      - name: Rebuild embedded public payload
        run: python scripts/build_desktop_installers.py --payload-only
      - name: Native Go tests
        working-directory: desktop-installer
        run: go test -v ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: target-python-tests.xml
# Workflow source is supplied; no run is claimed before GitHub actually executes it.
