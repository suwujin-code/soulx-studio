name: Import reviewed release from Google Drive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-from-drive.yml'
      - 'docs/drive-import-request.json'

permissions:
  contents: write

concurrency:
  group: soulx-reviewed-release-import
  cancel-in-progress: false

jobs:
  import-and-publish:
    if: github.repository == 'suwujin-code/soulx-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check fixed-package guards and draft-aware release identity
        run: |
          python -m unittest discover -s tests -p test_import_flow.py -v
          python -m unittest discover -s tests -p test_release_draft_lookup.py -v
      - name: Download the exact reviewed source file from Drive
        run: python scripts/download_reviewed_drive_import.py
      - name: Verify full package before any application-source import
        run: python scripts/import_public_release.py --verify-only SoulX-Public-Import.zip
      - name: Import source, upload installers and video, verify remote bytes, publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import_public_release.py
# No Drive credentials are transferred. Only the fixed SHA-256 package is read.
# Drafts are resolved by their verified numeric release ID, not published-only tags.
# All remote attachments must pass byte-for-byte verification before publication.
