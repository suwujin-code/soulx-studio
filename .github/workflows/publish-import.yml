name: Import reviewed SoulX release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.release-import/READY.json']

permissions:
  contents: write

concurrency:
  group: soulx-reviewed-release-import
  cancel-in-progress: false

jobs:
  import-and-publish:
    if: github.repository == 'suwujin-code/soulx-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify, import and publish reviewed preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .release-import/import_release.py
