name: Import reviewed SoulX release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['SoulX-Public-Import.zip']

permissions:
  contents: write

concurrency:
  group: soulx-reviewed-release-import
  cancel-in-progress: false

jobs:
  import-and-publish:
    if: github.repository == 'suwujin-code/soulx-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reviewed package before any publication
        run: python scripts/import_public_release.py --verify-only SoulX-Public-Import.zip
      - name: Import source and publish verified preview attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import_public_release.py
